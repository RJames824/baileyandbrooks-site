<script>
document.getElementById('c').addEventListener('click',async function(){
 var b=this,el=document.getElementById('sig'),r=document.createRange();r.selectNodeContents(el);

 try{ok=document.execCommand('copy')}catch(e){}
 if(!ok&&navigator.clipboard&&window.ClipboardItem){try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([el.innerHTML],{type:'text/html'}),'text/plain':new Blob([el.innerText],{type:'text/plain'})})]);ok=true}catch(e){}}
